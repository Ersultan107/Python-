<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><title>Python LEGO</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#15161a;--card:#1e2026;--bd:#2f323b;--tx:#eceef2;--mu:#9aa0ad;--ac:#7c9cff;--ok:#4ade80;--bad:#f87171;--code:#0f1013;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding:12px 16px 8px;border-bottom:1px solid var(--bd)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.top h1{font-size:19px;margin:0}
.bar{height:6px;background:var(--bd);border-radius:9px;margin:8px 0}.bar i{display:block;height:100%;background:var(--ac);border-radius:9px;transition:width .4s}
.sub{color:var(--mu);font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0}.chip{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:9px 14px;font-size:15px;cursor:pointer}.chip.on{border-color:var(--ac);background:#273052}
main{max-width:860px;margin:0 auto;padding:12px 16px 110px}
h3{font-size:15px;color:var(--mu);font-weight:600;margin:20px 0 8px}
.card{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:12px;padding:12px;margin-bottom:8px;font:inherit;font-size:16px;cursor:pointer}
.card b{min-width:32px;color:var(--ac)}.card span{flex:1}.card em{font-style:normal;color:var(--mu);font-size:13px}.card.ok{border-color:#1f5a38}.card.ok em{color:var(--ok)}
.btn{background:var(--ac);color:#0c1020;border:0;border-radius:12px;padding:13px 18px;font:inherit;font-weight:600;cursor:pointer;min-height:48px}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.btn:disabled{opacity:.4}
.task{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.lv{display:flex;gap:6px;margin:8px 0}
.asm{min-height:110px;background:var(--code);border:1px dashed var(--bd);border-radius:12px;padding:12px;overflow-x:auto;white-space:pre;font-size:16px;margin:10px 0;transition:border-color .3s}
.asm.ok{border-color:var(--ok);box-shadow:0 0 0 3px #4ade8033}.asm .ph{color:var(--mu);font-family:system-ui}
.pool{display:flex;flex-wrap:wrap;gap:10px}
.blk{background:#2a2f3d;color:var(--tx);border:1px solid #3a4052;border-radius:10px;padding:12px 16px;font-size:17px;min-height:48px;cursor:pointer}
.blk:active{transform:scale(.96)}.blk.used{display:none}
.blk.bad{animation:sh .4s;border-color:var(--bad);background:#3d2326}@keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.msg{border-left:3px solid var(--mu);padding:8px 12px;margin:10px 0;background:#ffffff08;border-radius:0 8px 8px 0;min-height:20px}.msg.bad{border-color:var(--bad)}.msg.ok{border-color:var(--ok)}.msg.hint{border-color:#fbbf24}
.tip{font-size:15px;color:var(--mu);background:#ffffff06;border-radius:10px;padding:10px 12px;margin:10px 0}.tip b{color:var(--tx)}
.ed{background:var(--code);border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin:10px 0}
.ed .dots{padding:8px 12px;background:#1a1c22;color:var(--mu);font-size:13px}.ed .body{overflow-x:auto;padding:10px 0}
.ln{display:flex;font-size:16px;white-space:pre}.ln i{width:38px;text-align:right;padding-right:12px;color:#5b6070;font-style:normal;flex:none}
.k{color:#c792ea}.s{color:#c3e88d}.n{color:#f78c6c}.f{color:#82aaff}
.bl{border-top:1px solid var(--bd);padding:10px 0}.bl code{color:var(--ac);font-size:16px}.bl ul{margin:6px 0 0;padding-left:20px;color:var(--mu);font-size:15px}
textarea,input[type=text]{width:100%;background:var(--code);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:12px;font:16px ui-monospace,Menlo,Consolas,monospace;margin:6px 0}
textarea{min-height:170px}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:#15161af2;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:center;z-index:6}
.bottom .btn{flex:1;max-width:240px}
.q{margin:12px 0;padding:12px;background:var(--card);border:1px solid var(--bd);border-radius:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.errs li{margin:4px 0;color:var(--mu)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.wrap{max-width:860px;margin:0 auto;padding:8px 16px 0}.chips{scrollbar-width:none}.chips::-webkit-scrollbar{display:none}header{padding:8px 16px 4px}.bar{margin:4px 0 6px}.top .chip{padding:7px 12px}main{padding-bottom:140px}.bottom{background:#15161a}</style></head><body>
<header><div class="top"><h1>🧩 Python LEGO</h1><button class="chip" id="lg" onclick="setLang()"></button></div><div class="sub" id="prog"></div><div class="bar"><i id="pb"></i></div></header><div class="wrap" id="sub"><div class="sub" id="topics"></div><div class="chips" id="chips"></div></div>
<main id="app"></main><div class="bottom" id="bot"></div>
<script>
const T=[{"id": 1, "s": 1, "n": 1, "tp": "print: мәтінді экранға шығару", "t": "Экранға өз атыңызды шығарыңыз."}, {"id": 2, "s": 1, "n": 2, "tp": "print: мәтінді экранға шығару", "t": "Экранға «Мен Python тілін үйреніп жатырмын» деген мәтінді шығарыңыз."}, {"id": 3, "s": 1, "n": 3, "tp": "print: мәтінді экранға шығару", "t": "Өз атыңызды, жасыңызды және қалаңызды жеке жолдарға шығарыңыз."}, {"id": 4, "s": 1, "n": 4, "tp": "Арифметикалық амалдар", "t": "Екі сан берілген. Олардың қосындысын табыңыз."}, {"id": 5, "s": 1, "n": 5, "tp": "Арифметикалық амалдар", "t": "Екі сан берілген. Олардың айырмасын табыңыз."}, {"id": 6, "s": 1, "n": 6, "tp": "Арифметикалық амалдар", "t": "Екі сан берілген. Олардың көбейтіндісін табыңыз."}, {"id": 7, "s": 1, "n": 7, "tp": "Арифметикалық амалдар", "t": "Екі сан берілген. Бірінші санды екінші санға бөліңіз."}, {"id": 8, "s": 1, "n": 8, "tp": "input және формулалар бойынша есептеу", "t": "Пайдаланушыдан оның атын сұрап, экранға сәлемдесу хабарламасын шығарыңыз."}, {"id": 9, "s": 1, "n": 9, "tp": "input және формулалар бойынша есептеу", "t": "Пайдаланушыдан жасын сұраңыз. Оның 5 жылдан кейінгі жасын есептеңіз."}, {"id": 10, "s": 1, "n": 10, "tp": "input және формулалар бойынша есептеу", "t": "Пайдаланушыдан екі сан енгізуді сұрап, олардың орташа арифметикалық мәнін табыңыз."}, {"id": 11, "s": 1, "n": 11, "tp": "input және формулалар бойынша есептеу", "t": "Тіктөртбұрыштың ұзындығы мен енін енгізіп, оның ауданын есептеңіз."}, {"id": 12, "s": 1, "n": 12, "tp": "input және формулалар бойынша есептеу", "t": "Шаршының қабырғасын енгізіп, оның ауданын есептеңіз."}, {"id": 13, "s": 1, "n": 13, "tp": "input және формулалар бойынша есептеу", "t": "Тауардың бағасы мен санын енгізіп, жалпы құнын есептеңіз."}, {"id": 14, "s": 1, "n": 14, "tp": "input және формулалар бойынша есептеу", "t": "Тауардың бағасы берілген. Оған 10% жеңілдік жасап, жаңа бағасын есептеңіз."}, {"id": 15, "s": 1, "n": 15, "tp": "input және формулалар бойынша есептеу", "t": "Пайдаланушы теңгедегі соманы енгізеді. Оны доллар курсы бойынша долларға айналдырыңыз."}, {"id": 16, "s": 1, "n": 16, "tp": "input және формулалар бойынша есептеу", "t": "Пайдаланушы сағат санын енгізеді. Оны минутқа айналдырыңыз."}, {"id": 17, "s": 1, "n": 17, "tp": "input және формулалар бойынша есептеу", "t": "Пайдаланушы минут санын енгізеді. Оны секундқа айналдырыңыз."}, {"id": 18, "s": 1, "n": 18, "tp": "input және формулалар бойынша есептеу", "t": "Цельсий бойынша температураны енгізіп, оны Фаренгейтке айналдырыңыз."}, {"id": 19, "s": 1, "n": 19, "tp": "Санды салыстыру шарттары", "t": "Пайдаланушы сан енгізеді. Санның 10-ға тең немесе тең емес екенін анықтаңыз."}, {"id": 20, "s": 1, "n": 20, "tp": "Санды салыстыру шарттары", "t": "Пайдаланушы сан енгізеді. Санның оң сан екенін анықтаңыз."}, {"id": 21, "s": 1, "n": 21, "tp": "Санды салыстыру шарттары", "t": "Пайдаланушы сан енгізеді. Санның теріс сан екенін анықтаңыз."}, {"id": 22, "s": 1, "n": 22, "tp": "Санды салыстыру шарттары", "t": "Пайдаланушы сан енгізеді. Санның нөлге тең екенін анықтаңыз."}, {"id": 23, "s": 1, "n": 23, "tp": "if / else: қарапайым шарттар", "t": "Пайдаланушының жасын енгізіңіз. Егер жасы 18 немесе одан жоғары болса, «Кіруге рұқсат» деген хабарлама шығарыңыз. Әйтпесе «Кіруге рұқсат жоқ» деген хабарлама шығарыңыз."}, {"id": 24, "s": 1, "n": 24, "tp": "if / else: қарапайым шарттар", "t": "Пайдаланушы балын енгізеді. Егер балл 50 немесе одан жоғары болса, «Сынақтан өтті» деген хабарлама шығарыңыз. Әйтпесе «Сынақтан өтпеді» деп шығарыңыз."}, {"id": 25, "s": 1, "n": 25, "tp": "if / else: қарапайым шарттар", "t": "Пайдаланушы пароль енгізеді. Егер пароль дұрыс болса, «Пароль дұрыс» деген хабарлама шығарыңыз. Әйтпесе «Пароль қате» деп шығарыңыз."}, {"id": 26, "s": 1, "n": 26, "tp": "if / else: қарапайым шарттар", "t": "Пайдаланушы екі сан енгізеді. Қай санның үлкен екенін анықтаңыз."}, {"id": 27, "s": 1, "n": 27, "tp": "if / else: қарапайым шарттар", "t": "Пайдаланушы екі сан енгізеді. Қай санның кіші екенін анықтаңыз."}, {"id": 28, "s": 1, "n": 28, "tp": "if / else: қарапайым шарттар", "t": "Пайдаланушы үш сан енгізеді. Ең үлкен санды анықтаңыз."}, {"id": 29, "s": 1, "n": 29, "tp": "elif және күрделі шарттар (and/or, %)", "t": "Студенттің жинаған балын енгізіңіз. Баллға байланысты нәтижені анықтаңыз: 90–100 — «Өте жақсы», 70–89 — «Жақсы», 50–69 — «Қанағаттанарлық», 0–49 — «Қанағаттанарлықсыз»."}, {"id": 30, "s": 1, "n": 30, "tp": "elif және күрделі шарттар (and/or, %)", "t": "Пайдаланушы айдың нөмірін енгізеді. Айдың атауын анықтаңыз."}, {"id": 31, "s": 1, "n": 31, "tp": "elif және күрделі шарттар (and/or, %)", "t": "Пайдаланушы аптаның күн нөмірін енгізеді. Апта күнінің атауын анықтаңыз."}, {"id": 32, "s": 1, "n": 32, "tp": "elif және күрделі шарттар (and/or, %)", "t": "Пайдаланушы жасын енгізеді. Оның бала, оқушы, студент немесе ересек екенін анықтаңыз."}, {"id": 33, "s": 1, "n": 33, "tp": "elif және күрделі шарттар (and/or, %)", "t": "Пайдаланушы дүкендегі сатып алу сомасын енгізеді. Егер сома 20 000 теңгеден жоғары болса, 10% жеңілдік есептеңіз."}, {"id": 34, "s": 1, "n": 34, "tp": "elif және күрделі шарттар (and/or, %)", "t": "Пайдаланушы логин мен пароль енгізеді. Екеуінің де дұрыс енгізілгенін тексеріңіз."}, {"id": 35, "s": 1, "n": 35, "tp": "elif және күрделі шарттар (and/or, %)", "t": "Пайдаланушы сан енгізеді. Оның жұп немесе тақ сан екенін анықтаңыз."}, {"id": 36, "s": 1, "n": 36, "tp": "elif және күрделі шарттар (and/or, %)", "t": "Пайдаланушы сан енгізеді. Егер сан 100-ден үлкен болса, «Үлкен сан», 100-ге тең болса, «100-ге тең», ал 100-ден кіші болса, «Кіші сан» деген хабарлама шығарыңыз."}, {"id": 37, "s": 1, "n": 37, "tp": "elif және күрделі шарттар (and/or, %)", "t": "Студенттің сабаққа қатысу пайызын енгізіңіз. Егер қатысуы 80%-дан жоғары болса, «Қатысу деңгейі жақсы» деп шығарыңыз, әйтпесе «Қатысу деңгейін жақсарту қажет» деп шығарыңыз."}, {"id": 38, "s": 1, "n": 38, "tp": "elif және күрделі шарттар (and/or, %)", "t": "Пайдаланушы жалақысын енгізеді. Егер жалақысы 300 000 теңгеден жоғары болса, «Жоғары жалақы», 150 000–300 000 аралығында болса, «Орташа жалақы», ал одан төмен болса, «Төмен жалақы» деп шығарыңыз."}, {"id": 39, "s": 1, "n": 39, "tp": "Жиынтық тапсырмалар (калькулятор, анкета)", "t": "Қарапайым калькулятор құрыңыз. Пайдаланушы екі сан және математикалық амал енгізеді. Бағдарлама қосу, азайту, көбейту немесе бөлу нәтижесін көрсетуі керек."}, {"id": 40, "s": 1, "n": 40, "tp": "Жиынтық тапсырмалар (калькулятор, анкета)", "t": "Пайдаланушыдан аты-жөнін, жасын, оқу орнын және мамандығын сұраңыз. Осы мәліметтерді пайдаланып, студент туралы қысқаша ақпаратты экранға шығарыңыз."}, {"id": 41, "s": 2, "n": 1, "tp": "Салыстыру: оң/теріс, жұп/тақ, ең үлкен/ең кіші", "t": "Пайдаланушыдан сан енгізіңіз. Санның оң немесе теріс екенін анықтаңыз."}, {"id": 42, "s": 2, "n": 2, "tp": "Салыстыру: оң/теріс, жұп/тақ, ең үлкен/ең кіші", "t": "Пайдаланушыдан сан енгізіңіз. Санның жұп немесе тақ екенін анықтаңыз."}, {"id": 43, "s": 2, "n": 3, "tp": "Салыстыру: оң/теріс, жұп/тақ, ең үлкен/ең кіші", "t": "Пайдаланушыдан жасын енгізіңіз. Егер жасы 18 немесе одан жоғары болса, «Кәмелетке толған» деп шығарыңыз."}, {"id": 44, "s": 2, "n": 4, "tp": "Салыстыру: оң/теріс, жұп/тақ, ең үлкен/ең кіші", "t": "Пайдаланушыдан екі сан енгізіңіз. Олардың қайсысы үлкен екенін анықтаңыз."}, {"id": 45, "s": 2, "n": 5, "tp": "Салыстыру: оң/теріс, жұп/тақ, ең үлкен/ең кіші", "t": "Пайдаланушыдан үш сан енгізіңіз. Ең үлкен санды анықтаңыз."}, {"id": 46, "s": 2, "n": 6, "tp": "Салыстыру: оң/теріс, жұп/тақ, ең үлкен/ең кіші", "t": "Пайдаланушыдан үш сан енгізіңіз. Ең кіші санды анықтаңыз."}, {"id": 47, "s": 2, "n": 7, "tp": "Диапазондар мен elif (балл, температура, мезгіл, күн)", "t": "Студенттің балын енгізіңіз. Балл 50 немесе одан жоғары болса, «Өтті», әйтпесе «Өтпеді» деп шығарыңыз."}, {"id": 48, "s": 2, "n": 8, "tp": "Диапазондар мен elif (балл, температура, мезгіл, күн)", "t": "Студенттің балын енгізіңіз. Нәтижені анықтаңыз: 90–100 — «Өте жақсы», 70–89 — «Жақсы», 50–69 — «Қанағаттанарлық», 0–49 — «Қанағаттанарлықсыз»."}, {"id": 49, "s": 2, "n": 9, "tp": "Диапазондар мен elif (балл, температура, мезгіл, күн)", "t": "Пайдаланушыдан температураны енгізіңіз. Егер температура 0-ден төмен болса — «Суық», 0–20 аралығында болса — «Салқын», 20-дан жоғары болса — «Жылы» деп шығарыңыз."}, {"id": 50, "s": 2, "n": 10, "tp": "Диапазондар мен elif (балл, температура, мезгіл, күн)", "t": "Пайдаланушыдан ай нөмірін енгізіңіз. Айдың қыс, көктем, жаз немесе күз мезгіліне жататынын анықтаңыз."}, {"id": 51, "s": 2, "n": 11, "tp": "Диапазондар мен elif (балл, температура, мезгіл, күн)", "t": "Пайдаланушыдан аптаның күн нөмірін енгізіңіз. Егер 1–5 болса — «Жұмыс күні», 6–7 болса — «Демалыс күні» деп шығарыңыз."}, {"id": 52, "s": 2, "n": 12, "tp": "Диапазондар мен elif (балл, температура, мезгіл, күн)", "t": "Пайдаланушыдан сан енгізіңіз. Егер сан 10-нан үлкен, 10-ға тең немесе 10-нан кіші екенін анықтаңыз."}, {"id": 53, "s": 2, "n": 13, "tp": "Күрделі шарттар (амал, жеңілдік, логин, бөлінгіштік, кібісе жыл, үшбұрыш)", "t": "Пайдаланушыдан екі сан және математикалық амал енгізіңіз. +, -, *, / амалдарының біріне байланысты нәтиже шығарыңыз."}, {"id": 54, "s": 2, "n": 14, "tp": "Күрделі шарттар (амал, жеңілдік, логин, бөлінгіштік, кібісе жыл, үшбұрыш)", "t": "Дүкендегі сатып алу сомасын енгізіңіз. Егер сома 10 000 теңгеден жоғары болса, 5% жеңілдік, 20 000 теңгеден жоғары болса, 10% жеңілдік жасаңыз."}, {"id": 55, "s": 2, "n": 15, "tp": "Күрделі шарттар (амал, жеңілдік, логин, бөлінгіштік, кібісе жыл, үшбұрыш)", "t": "Пайдаланушыдан логин мен пароль енгізуді сұраңыз. Егер екеуі де дұрыс болса, «Жүйеге қош келдіңіз» хабарламасын шығарыңыз."}, {"id": 56, "s": 2, "n": 16, "tp": "Күрделі шарттар (амал, жеңілдік, логин, бөлінгіштік, кібісе жыл, үшбұрыш)", "t": "Пайдаланушыдан адамның бойын сантиметрмен енгізіңіз. Егер бойы 170 см-ден жоғары болса — «Бойы ұзын», 150–170 см болса — «Орташа бой», 150 см-ден төмен болса — «Бо function rnd(a,seed){a=a.slice();for(let i=a.length-1;i>0;i--){seed=(seed*1103515245+12345)&0x7fffffff;const j=seed%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function tipKeys(t){let ks=(t.match(RX)||[t]).map(x=>/^["']/.test(x)?'str':/^\d/.test(x)?'num':TIPS[x]?x:/^\w+$/.test(x)?'var':null).filter(Boolean);ks=[...new Set(ks)];if(ks.length>1)ks=ks.filter(k=>k!='('&&k!=')'&&k!=',');return ks}
function tipHTML(t){return tipKeys(t).slice(0,4).map(k=>{const x=TP(k);return `<div><b>${esc(x[0])}</b> — ${esc(x[1])}${x[2]?` <span class="mono">Пример: ${esc(x[2])}</span>`:''}${x[3]?`<br>Зачем: ${esc(x[3])}`:''}</div>`}).join('')}
function hl(l){return l.split(/("[^"]*"|\b(?:if|else|elif|for|while|in)\b|\b(?:range|print|input|int|float)\b|\b\d+\b)/).map((x,i)=>{if(i%2==0)return esc(x);const c=/^"/.test(x)?'s':/^\d/.test(x)?'n':/^(if|else|elif|for|while|in)$/.test(x)?'k':'f';return `<span class="${c}">${esc(x)}</span>`}).join('')}
const editor=code=>`<div class="ed"><div class="dots">● ● ● main.py</div><div class="body">${code.split('\n').map((l,i)=>`<div class="ln"><i>${i+1}</i><span>${hl(l)}</span></div>`).join('')}</div></div>`;
function head(){$('#sub').style.display=view=='task'?'none':'';$('#lg').textContent='🌐 '+(P.lang=='kk'?'РУС':'ҚАЗ');const n=Object.keys(P.done).length;$('#prog').textContent=_('Выполнено: {0} / {1}',n,T.length);$('#pb').style.width=n/T.length*100+'%';
const tp=[...new Set(T.map(t=>t.s+t.tp))].filter(k=>T.filter(t=>t.s+t.tp==k).every(t=>P.done[t.id])).length;$('#topics').textContent=_('Пройдено тем: {0}. Ошибки в заданиях: {1}',tp,Object.keys(P.errs).length);
$('#chips').innerHTML=CAT.map(c=>`<button class="chip ${view=='list'&&cat==c[0]||(view=='errs'&&c[0]=='e')?'on':''}" onclick="setCat('${c[0]}')">${_(c[1])}</button>`).join('')}
function setCat(c){cat=c;view=c=='e'?'errs':'list';G=null;render()}
function render(){head();view=='task'?viewTask():view=='errs'?viewErrs():viewList();window.scrollTo(0,0)}
function viewList(){const f=CAT.find(c=>c[0]==cat)[2];let h='',last='';T.filter(f).forEach(t=>{const k=t.s+t.tp;if(k!=last){last=k;h+=`<h3>${_('Раздел')} ${t.s} · ${esc(t.tp)}</h3>`}const ok=P.done[t.id];h+=`<button class="card ${ok?'ok':''}" onclick="openT(${t.id})"><b>${t.id}</b><span>${esc(t.t)}</span><em>${ok?(P.wr[t.id]?'✓✓':'✓'):SOL[t.id]?'':'скоро'}</em></button>`});$('#app').innerHTML=h;$('#bot').innerHTML=''}
function viewErrs(){const ids=Object.keys(P.errs);let h='<h3>'+_('Мои ошибки')+'</h3>';if(!ids.length)h+='<p class="sub">'+_('Ошибок пока нет. Они появятся здесь, когда ты ошибёшься в задании.')+'</p>';ids.forEach(id=>{const t=T[id-1];h+=`<div class="task"><b>${_('Задание')} №${id}</b> <button class="btn g" onclick="openT(${id})">${_('Открыть')}</button><ul class="errs">${Object.keys(P.errs[id]).map(m=>`<li>${esc(m)} (×${P.errs[id][m]})</li>`).join('')}</ul></div>`});
$('#app').innerHTML=h;$('#bot').innerHTML=ids.length?`<button class="btn" onclick="openT(${ids[0]})">${_('Повторить ошибки')}</button>`:''}
function err(id,m){P.errs[id]=P.errs[id]||{};P.errs[id][m]=(P.errs[id][m]||0)+1;save()}
function openT(id,lv){const s=SOL[id];view='task';G={id,s,ph:'build',msg:'',h:0,mis:0};if(s){G.lv=lv||(P.lv3||{})[id]||3;setup()}render()}
function setup(){const{s,lv,id}=G;G.st=steps(s,lv);G.i=0;G.h=0;G.mis=0;G.ph='build';const have=new Set(G.st.map(x=>x.t));
const dec=lv==1?['x = float(input())','print(x)']:lv==2?['float(input())','-','==','else','while']:['float','while','==','-','else'];
let items=G.st.map(x=>x.t).concat(dec.filter(d=>!have.has(d)).slice(0,lv==1?1:3));G.pool=rnd(items,id*7+lv).map((t,i)=>({id:i,t,used:0}));P.lv3=P.lv3||{};P.lv3[id]=lv;G.msg='';G.tt=''}
function setLv(l){setup0(l)}function setup0(l){G.lv=l;setup();render()}
function asmHTML(){if(!G.i)return '<span class="ph">'+_('Соберите код здесь')+'</span>';const lines={};G.st.slice(0,G.i).forEach(x=>{(lines[x.li]=lines[x.li]||{ind:x.ind,p:[]}).p.push(x.t)});return Object.keys(lines).map(k=>' '.repeat(lines[k].ind)+hl0(jn2(lines[k].p).replace(/([,(]) - (\d)/g,'$1 -$2'))).join('\n')}
const hl0=hl;
function viewTask(){const t=T[G.id-1],s=G.s;let h=`<button class="btn g" onclick="setCat(cat)">${_('← К списку')}</button><div class="task"><div class="sub">${_('Задание')} №${t.id} · ${_('раздел')} ${t.s}, №${t.n}</div><p style="margin:6px 0">${esc(t.t)}</p>${s&&s.ex?`<div class="sub">${_('Пример:')} ${esc(exT(s.ex))}</div>`:''}</div>`;
if(!s){h+='<div class="task">Для этого задания конструктор ещё не добавлен. </div>';$('#app').innerHTML=h;$('#bot').innerHTML='';return}
if(G.ph=='build'){h+=`<div class="lv">${[1,2,3].map(l=>`<button class="chip ${G.lv==l?'on':''}" onclick="setLv(${l})">${_('Уровень')} ${l} ${_(['· строки','· части','· элементы'][l-1])}</button>`).join('')}</div><div class="asm" id="asm">${asmHTML()}</div><div class="msg" id="msg">${G.msg||'<span class="sub">'+_('Нажимай блоки по порядку. Если ошибёшься — объясню почему.')+'</span>'}</div><div class="tip" id="tip">${G.tt?tipHTML(G.tt):_('Нажми на блок — здесь появится его объяснение.')}</div><div class="pool" id="pool">${G.pool.map(b=>`<button class="blk mono ${b.used?'used':''}" onclick="pick(${b.id})">${esc(b.t)}</button>`).join('')}</div>`;
$('#bot').innerHTML=`<button class="btn g" onclick="hint()">${_('💡 Подсказка')}</button><button class="btn g" onclick="setup0(G.lv)">${_('↺ Сначала')}</button>`}
else{h+=`<div class="msg ok"><b>${_('✓ Код собран правильно!')}</b>${G.mis?' '+_('Ошибок при сборке: {0}.',G.mis):' '+_('Без единой ошибки.')}</div>`+editor(solText(s));
if(G.ph=='done'){h+='<h3>'+_('Разберём код по строкам')+'</h3>'+s.c.map(([l,n],i)=>`<div class="bl"><b>${i+1}.</b> <code>${esc(UJ(l).trim())}</code><div>${esc(_('Здесь {0}.',noteT({raw:UJ(l),note:n})))}</div><ul>${[...new Set(tipKeys(UJ(l)))].filter(k=>k!='('&&k!=')'&&k!=',').map(k=>`<li>${esc(TP(k)[0])} — ${esc(TP(k)[1])}</li>`).join('')}</ul></div>`).join('');
h+=`<div class="row"><button class="btn" onclick="G.ph='write';render()">${_('✍️ Попробовать написать самому')}</button><button class="btn g" onclick="teach()">${_('👩‍🏫 Вопросы преподавателя')}</button>${nextId()?`<button class="btn g" onclick="openT(nextId())">${_('Следующее задание →')}</button>`:''}</div>`}
if(G.ph=='write')h=h.replace(editor(solText(s)),'')+`<h3>${_('Напиши код сам')}</h3><textarea id="ta" spellcheck="false" autocapitalize="off" autocorrect="off" placeholder="${_('Пиши код здесь. Отступ — 4 пробела.')}"></textarea><div class="msg" id="wm"></div><div class="row"><button class="btn" onclick="check()">${_('Проверить')}</button><button class="btn g" onclick="G.ph='done';render()">${_('Показать разбор')}</button></div>`;
if(G.ph=='teach')h+=`<h3>${_('Вопросы преподавателя')}</h3>`+G.qs.map(QT).map((q,i)=>`<div class="q"><b>${i+1}. ${esc(q[0])}</b><input type="text" id="qa${i}" placeholder="${_('Твой ответ')}"><button class="btn g" onclick="ans(${i})">${_('Ответить')}</button><div class="msg" id="qm${i}" style="display:none"></div></div>`).join('')+`<div class="row"><button class="btn g" onclick="G.ph='done';render()">${_('← К разбору')}</button>${nextId()?`<button class="btn" onclick="openT(nextId())">${_('Следующее задание →')}</button>`:''}</div>`;
$('#bot').innerHTML=`<button class="btn g" onclick="setCat(cat)">${_('← Список')}</button>${nextId()?`<button class="btn" onclick="openT(nextId())">${_('Дальше →')}</button>`:''}`}
$('#app').innerHTML=h}
function nextId(){for(let i=G.id+1;i<=T.length;i++)if(SOL[i])return i;return 0}
function pick(pid){if(G.ph!='build')return;const e=G.st[G.i],b=G.pool.find(x=>x.id==pid);if(!b||b.used)return;G.tt=b.t;$('#tip').innerHTML=tipHTML(b.t);
if(b.t===e.t){b.used=1;G.i++;G.h=0;G.msg='';if(G.i>=G.st.length){finish();return}$('#asm').innerHTML=asmHTML();$('#asm').classList.add('ok');setTimeout(()=>$('#asm')&&$('#asm').classList.remove('ok'),350);b.used=1;$('#msg').innerHTML='<span class="sub">'+_('Верно! Дальше.')+'</span>';$('#msg').className='msg ok';document.querySelector(`#pool button:nth-child(${G.pool.indexOf(b)+1})`).classList.add('used')}
else{G.mis++;const later=G.st.slice(G.i+1).some(s=>s.t===b.t);const m=_(later?'«{0}» понадобится, но пока рано.':'«{0}» в этой программе не нужен.',b.t)+' '+_('Сейчас мы: {0}.',noteT(e));err(G.id,_(later?'слишком рано использовал «{0}»':'лишний элемент «{0}»',b.t));$('#msg').innerHTML=esc(m);$('#msg').className='msg bad';const el=document.querySelector(`#pool button:nth-child(${G.pool.indexOf(b)+1})`);el.classList.remove('bad');void el.offsetWidth;el.classList.add('bad')}}
function hint(){const e=G.st[G.i];if(!e)return;G.h++;let m;if(G.h==1)m=_('Подумай: что должна сделать следующая часть программы?');else if(G.h==2)m=_('Сейчас мы: {0}.',noteT(e));else if(G.h==3)m=_('Нужный элемент начинается с «{0}».',e.t[0]);else{const b=G.pool.find(x=>!x.used&&x.t===e.t);G.mis++;err(G.id,_('пользовался подсказкой-ответом'));pick(b.id);return}$('#msg').innerHTML='💡 '+esc(m);$('#msg').className='msg hint'}
function finish(){G.ph='done';P.done[G.id]=1;if(!(G.id in P.best)||G.mis<P.best[G.id])P.best[G.id]=G.mis;if(!G.mis)delete P.errs[G.id];save();head();render()}
function norm(c,loose){const mp={};let n=0;return c.replace(/\t/g,'    ').split('\n').filter(l=>l.trim()).map(l=>Math.round(l.match(/^ */)[0].length/4)+':'+(l.trim().match(RX)||[]).map(t=>{if(/^["']/.test(t))return loose?'S':'"'+t.slice(1,-1)+'"';if(/^[A-Za-z_]\w*$/.test(t)&&!KW.has(t))return mp[t]||(mp[t]='v'+(++n));return t}).join(' ')).join('\n')}
function diag(u,s,loose){const m=[],ns=s.replace(/"[^"]*"/g,''),has=(x,w)=>new RegExp('\\b'+w+'\\b').test(x);
if((u.match(/\(/g)||[]).length!=(u.match(/\)/g)||[]).length)m.push('Скобки не сходятся: у каждой ( должна быть своя ).');
if(/int\(/.test(s)&&!/int\(/.test(u))m.push('Пропущен int(). input() получает данные как текст, а здесь нам нужно число.');
if(/\b(if|elif|while)\b[^:\n]*[^=!<>]=[^=]/.test(u))m.push('Ты использовал = вместо ==. = записывает значение в переменную, а == сравнивает два значения.');
if(u.split('\n').some(l=>/^\s*(if|elif|else|for|while)\b/.test(l)&&!/:\s*$/.test(l)))m.push('В конце строки с if / else / for / while нужно двоеточие :');
['print','input','if','else','for','range','while'].forEach(w=>{if(has(s,w)&&!has(u,w))m.push(`Не хватает «${w}».`)});
[['%','%'],['//','//'],['+','\\+'],['-','-'],['*','\\*']].forEach(([o,r])=>{if(new RegExp(r).test(ns)&&!new RegExp(r).test(u.replace(/"[^"]*"/g,'')))m.push(`Не хватает действия «${o}».`)});
if(/(^|[^\/])\/([^\/]|$)/.test(ns)&&!/(^|[^\/])\/([^\/]|$)/.test(u.replace(/"[^"]*"/g,'')))m.push('Не хватает деления «/».');
if(!loose)(s.match(/"[^"]*"/g)||[]).forEach(x=>{if(!u.replace(/'/g,'"').includes(x))m.push(`Текст ${x} нужно вывести точно так же, вместе с кавычками.`)});
if(u.split('\n').filter(l=>l.trim()).length<s.split('\n').length&&!m.length)m.push('Программа короче, чем нужно: каких-то строк не хватает.');
if(!m.length)m.push('Код отличается от ожидаемого. Проверь порядок строк, отступы (4 пробела внутри if / else / for) и имена. Проверка сравнивает структуру с типовым решением, поэтому нестандартный вариант может не пройти.');return m}
function check(){const u=$('#ta').value,s=G.s,sol=solText(s),ok=[sol,...(s.alt||[])].some(a=>norm(a,s.loose)==norm(u,s.loose));
if(!u.trim()){$('#wm').innerHTML=_('Поле пустое.');return}
if(ok){P.wr[G.id]=1;save();head();$('#wm').className='msg ok';$('#wm').innerHTML='<b>'+_('✓ Верно!')+'</b> '+_('Ты написал программу сам. Теперь попробуй ответить на вопросы преподавателя.')}
else{const m=diag(u,sol,s.loose).map(dm);m.forEach(x=>err(G.id,x.slice(0,60)));$('#wm').className='msg bad';$('#wm').innerHTML=m.map(esc).join('<br>')}}
function teach(){const toks=new Set(solText(G.s).match(RX)),q=[];Object.keys(QB).forEach(k=>{if(k!='out'&&k!='loopvar'&&toks.has(k)||(k=='loopvar'&&toks.has('for'))||(k=='str'&&/"/.test(solText(G.s))))q.push(k)});if(q.length<3)q.push('out');G.qs=q.slice(0,5);G.ph='teach';render()}
function ans(i){const v=$('#qa'+i).value.toLowerCase(),k0=G.qs[i],q=QT(k0),ok=v.trim().length>1&&QB[k0][1].concat((QBK[k0]||[0,[]])[1]).some(k=>v.includes(k)),m=$('#qm'+i);m.style.display='block';m.className='msg '+(ok?'ok':'bad');m.innerHTML=ok?_('✓ Верно. ')+esc(q[2]):_('Пока не совсем. ')+esc(q[2])+' '+_('Попробуй ответить своими словами ещё раз.');if(!ok)err(G.id,_('вопрос: ')+q[0].slice(0,50))}
document.addEventListener('keydown',e=>{if(view=='task'&&G&&G.ph=='build'&&/^[1-9]$/.test(e.key)&&!/TEXTAREA|INPUT/.test(e.target.tagName)){const b=G.pool.filter(x=>!x.used)[+e.key-1];if(b)pick(b.id)}});
render();
</script></body></html>
